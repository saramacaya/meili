name: Keep Supabase and Render backend alive

# Runs on a schedule so the Supabase free-tier project (and the Render
# backend) see periodic real traffic and don't auto-pause / cold-start.
# Also runnable manually from the Actions tab for a quick check.
on:
  schedule:
    # Every 2 days at 09:00 UTC. Supabase free tier pauses after ~7 days
    # of inactivity, so this leaves a wide safety margin.
    - cron: "0 9 */2 * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the backend keepalive endpoint
        run: |
          url="https://meili-backend.onrender.com/system/keepalive"
          echo "Pinging $url"

          http_status=$(curl -s -o response.json -w "%{http_code}" "$url")
          echo "HTTP status: $http_status"
          echo "Response body:"
          cat response.json

          if [ "$http_status" -ne 200 ]; then
            echo "::error::Keepalive ping failed with HTTP $http_status"
            exit 1
          fi

          if grep -q '"supabase_reachable": false' response.json; then
            echo "::error::Backend reached, but Supabase was not reachable."
            exit 1
          fi
