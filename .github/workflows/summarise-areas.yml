name: Summarise area context with AI

# Writes one short, neutral summary per neighbourhood from Meili's stored
# opinion/incident records (no new facts), and commits the result.
# Uses GitHub Models: free, rate-limited, no API key needed.
# Runs automatically when opinion data changes, or by hand.
on:
  push:
    paths:
      - "backend/data/social_context/**/public_opinions.json"
  workflow_dispatch: {}

permissions:
  contents: write
  models: read

jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Generate summaries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MEILI_AI_PROVIDER: github
        run: python backend/tools/summarise_areas.py
      - name: Commit new summaries
        run: |
          git config user.name "meili-bot"
          git config user.email "meili-bot@users.noreply.github.com"
          git add backend/data/social_context/*/area_summaries.json
          git diff --cached --quiet || git commit -m "Update AI area summaries"
          git push
